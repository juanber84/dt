# Frontal de Digital Twin (Dockerfile.web)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # DNS de Docker: resuelve digitaltwin-api en cada petición (sigue funcionando si se recrea)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://digitaltwin-api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PDFs de Clínica (CLINICAL_UPLOAD_LIMIT, 15mb) y fotos en base64 de /api/v1/nutrition
    # (NUTRITION_BODY_LIMIT, 10mb): por encima del mayor, que el límite lo ponga la API
    client_max_body_size 16m;
  }

  # Avisos de Google Health (/webhooks/google-health): sin esto los resolvería la SPA
  location /webhooks/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Documentación (VitePress, ficheros estáticos con enlaces .html)
  location /docs/ {
    try_files $uri $uri.html $uri/ =404;
    error_page 404 /docs/404.html;
    add_header Cache-Control "no-cache";
  }

  location /docs/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Assets con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Manifest de la PWA: el mime.types de nginx no trae .webmanifest (lo serviría como binario)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier otra ruta la resuelve vue-router
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
