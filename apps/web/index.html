<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: en el iPhone la app ocupa también la zona de la isla y del indicador
         de inicio; los márgenes los pone el CSS con env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Digital Twin</title>

    <!-- PWA: se instala desde Safari con Compartir → Añadir a pantalla de inicio. Sin service
         worker a propósito: así siempre carga la última versión (llegará con las notificaciones) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Pantalla de arranque de la app instalada en iOS (sin ella pinta un blanco): una por
         tamaño de iPhone, fondo del tema oscuro e icono. Se generan con
         apps/web/scripts/splash.py; iOS las coge al añadir la app a la pantalla de inicio -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1260x2736.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1284x2778.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1242x2688.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/1242x2208.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/750x1334.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Twin" />
    <!-- black-translucent: la app pinta también bajo la barra de estado (con default sale una franja
         blanca encima del tema oscuro). Su texto es siempre blanco: en el tema claro va sobre
         .status-shade (App.vue) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Fondo desde el primer instante, antes de que llegue el CSS (oscuro salvo tema claro) -->
    <style>
      html {
        background: #0f0f0e;
      }
      html[data-theme='light'] {
        background: #f4f4f1;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) {
          background: #f4f4f1;
        }
      }
    </style>
    <!-- El tema antes de pintar nada (si no, se ve un destello claro al abrir): ver useTheme.js -->
    <script>
      try {
        var theme = localStorage.getItem('digitaltwin:theme') || 'dark';
        if (theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
